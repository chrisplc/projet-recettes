services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recettes
      POSTGRES_PASSWORD: recettes
      POSTGRES_DB: recettes
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recettes -d recettes"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    image: node:26-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      # The container keeps its own node_modules (Linux), separate from the Mac's
      - /app/node_modules
    command: sh -c "npm install && npm run migrate && npm run seed && npm run dev"
    environment:
      # These win over backend/.env inside the container
      DATABASE_URL: postgres://recettes:recettes@database:5432/recettes
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:26-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data: {}
